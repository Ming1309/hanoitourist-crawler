[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hanoitourist-crawler"
version = "0.2.0"
description = "Domestic incremental crawler with PostgreSQL raw staging and scheduled XLSX exports"
requires-python = ">=3.11"
dependencies = ["playwright>=1.50,<2", "beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "sqlfluff>=3,<4"]

[project.scripts]
hanoitourist = "hanoitourist_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hanoitourist_crawler.persistence" = ["sql/*.sql"]

[tool.ruff]
line-length = 120

[tool.sqlfluff.core]
dialect = "postgres"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires installed Chromium, uses offline route mocks", "postgres: requires TEST_DATABASE_URL and an isolated schema"]
